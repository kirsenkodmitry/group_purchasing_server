services:
  product_service_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: product_service_db
    ports:
      - "3309:3306"
    volumes:
      - /home/kirsenko/docker/mysql/product_service_db:/var/lib/mysql

  product_service_app:
    build: .
    depends_on:
      - product_service_db
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://product_service_db:3306/product_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
